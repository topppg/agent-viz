[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spiritboard"
version = "0.1.0"
description = "Local, read-only visibility into agent runs and subagents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spiritboard = "spiritboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spiritboard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded browser-script fixture; wrapping it would obscure the JavaScript under test.
"tests/test_static.py" = ["E501"]
