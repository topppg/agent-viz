[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spiritboard"
version = "0.1.0"
description = "Local, read-only visibility into agent runs and subagents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "keyring>=25.7.0,<26",
    "pyjwt[crypto]>=2.15.1,<3",
]
keywords = ["agents", "dashboard", "local-first", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/topppg/spiritboard"
Source = "https://github.com/topppg/spiritboard"
Issues = "https://github.com/topppg/spiritboard/issues"
Documentation = "https://github.com/topppg/spiritboard/blob/main/docs/DISTRIBUTION.md"

[project.scripts]
spiritboard = "spiritboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spiritboard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/.github/workflows/release.yml", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded browser-script fixture; wrapping it would obscure the JavaScript under test.
"tests/test_static.py" = ["E501"]
